name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build documentation (strict)
        # Hermetic build: only the docs toolchain + typer are installed (no
        # torch / gradio / etc.) because conf.py mocks every heavy import.
        # -W turns any Sphinx warning (e.g. an autodoc import failure) into a
        # build failure (Sphinx >= 8.1 collects all warnings before failing).
        run: >-
          uv run --python 3.12 --no-project
          --with sphinx --with furo --with sphinx-autodoc-typehints --with typer
          sphinx-build -W -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Only publish from main; pull requests just validate the build above.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
