name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Rich force-enables terminal styling under GITHUB_ACTIONS (NO_COLOR only
      # drops color, keeping bold/dim codes; TERM=dumb disables styling fully).
      # test_cli.py help asserts are unstyle()-robust since the follow-up PR, so
      # this is belt-and-suspenders for any future output-sensitive test.
      TERM: dumb
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/ophir
      - run: uv run pytest
