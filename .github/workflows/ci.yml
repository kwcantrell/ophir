name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Rich force-enables terminal styling under GITHUB_ACTIONS, which breaks
      # test_cli.py's plain-substring asserts on Typer --help output. TERM=dumb
      # is the one knob Rich honors unconditionally (NO_COLOR only drops color,
      # keeping bold/dim codes). Verified locally: GITHUB_ACTIONS=true TERM=dumb
      # -> full suite green.
      TERM: dumb
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/ophir
      - run: uv run pytest
