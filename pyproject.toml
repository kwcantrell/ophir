[tool.ruff]
# Exclude commonly ignored directories and files.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "saved-models",
    "data"
]

# Set the target Python version for linting and formatting.
target-version = "py310" # Adjust to your project's target Python version

# Set the preferred line length.
line-length = 100 # Matches Black's default

[tool.ruff.lint]
# Enable a core set of rules for general code quality.
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
]

# Ignore specific rules that might be too restrictive or conflict with other tools.
ignore = [
    "E402",
    "E501", # Line too long (handled by formatter)
    "F401", # unused imports
]

[tool.ruff.format]
# Configure Ruff's formatter to match Black's style.
quote-style = "double"
indent-style = "space"
line-ending = "auto"