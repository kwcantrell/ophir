[project]
name = "ophir"
version = "0.6.1"
description = "BERT-style masked transformer for stock OHLC prediction, with a Gradio UI and local-LLM chat."
readme = "README.md"
authors = [
    { name = "Kalen Cantrell", email = "cantrell.kalen@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "gradio>=6.4.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.2.7",
    "langchain-ollama>=1.0.1",
    "lightning>=2.6.0",
    "lxml>=6.0.2",
    "massive>=2.0.3",
    "numpy>=2.2.6",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "pyarrow>=23.0.0",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "torch>=2.10.0",
    "transformers>=4.57.6",
    "typer>=0.21.1",
    "yfinance>=1.3.0",
]

[project.scripts]
ophir = "ophir.cli:app"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade (catches Optional[X] -> X | None, etc.)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "ANN401",  # Any — needed for torch/whisper interop
    "B008",    # function calls in default args — conflicts with FastAPI Depends pattern
    "N812",    # `import lightning as L` / `torch.nn.functional as F` are standard aliases
]
unfixable = [
    "F401",  # unused imports — don't auto-remove; files may be edited incrementally
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["ophir"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.18,<2.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "sphinx-autodoc-typehints>=2.5",
]

[tool.mypy]
python_version = "3.10"          # lowest supported runtime, NOT ruff's py312
files = ["src/ophir"]
exclude = ['^oldcode/', '^notebooks/', '^docs/', '^\.venv/']
strict = true
show_error_codes = true
pretty = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party deps that ship no stubs / no py.typed marker.
module = [
    "massive.*",
    "plotly.*",
    "tqdm.*",
    "yfinance.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Third-party churn we don't own (pandas freq='D', numpy, torch, yfinance).
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
    "default::FutureWarning",
]
